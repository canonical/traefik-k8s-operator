name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directory where the Terraform modules live.
on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/generate_terraform_docs.yaml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/generate_terraform_docs.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main
    secrets: inherit
    with:
      terraform-directory: terraform
