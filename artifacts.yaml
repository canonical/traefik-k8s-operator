version: 1
rocks: []
charms:
- name: traefik-k8s
  charmcraft-yaml: charmcraft.yaml
  resources:
    traefik-image:
      type: oci-image
  platforms:
  - arch: amd64
    # ubuntu-22.04 runners still use kernel 6.8. Kernel 7.0 (ubuntu-24.04/26.04 runners)
    # rejects the AppArmor profile snapd loads in the ubuntu@20.04 build container.
    runner: [ubuntu-22.04]
  - arch: arm64
    runner: [ubuntu-24.04-arm]
  - arch: s390x
    runner: [self-hosted-linux-s390x-noble-medium]
snaps: []
