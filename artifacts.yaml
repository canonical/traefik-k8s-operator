version: 1
rocks: []
charms:
- name: traefik-k8s
  charmcraft-yaml: charmcraft.yaml
  resources:
    traefik-image:
      type: oci-image
  platforms:
  - arch: amd64
    # Kernel 7.0 (GitHub ubuntu-24.04/26.04 runners) rejects the AppArmor profile snapd loads
    # in the ubuntu@20.04 build container. This self-hosted noble runner uses kernel 6.8.
    runner: [self-hosted-linux-amd64-noble-large]
  - arch: arm64
    runner: [ubuntu-24.04-arm]
  - arch: s390x
    runner: [self-hosted-linux-s390x-noble-medium]
snaps: []
