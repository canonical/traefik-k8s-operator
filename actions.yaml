show-proxied-endpoints:
  description: |
    Returns a list of endpoints,
    including both the endpoints proxied by this Traefik proxy and Traefik's own endpoint.

show-external-endpoints:
  description: |
    Returns a list of endpoints, 
    including both the endpoints proxied by this Traefik proxy and Traefik's own endpoint.
    This action uses the address of the upstream ingress if one exists.

get-loadbalancer-ip:
  description: |
    Returns the external LoadBalancer IP address assigned to the Traefik service.
    Waits for the IP to become available up to the specified timeout.
  params:
    timeout:
      description: Maximum time in seconds to wait for the IP to become available.
      type: integer
      default: 300
