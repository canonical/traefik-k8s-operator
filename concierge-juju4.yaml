juju:
  channel: 4.1/edge
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "true"

providers:
  lxd:
    enable: true
  k8s:
    enable: true
    bootstrap: true
    bootstrap-constraints:
      root-disk: "4G"
    features:
      load-balancer:
        l2-mode: "true"
        cidrs: "10.43.45.0/28"
      local-storage: {}
      network: {}

host:
  snaps:
    charmcraft:
