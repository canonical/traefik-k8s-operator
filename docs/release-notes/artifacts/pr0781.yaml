# Version of the artifact schema
version_schema: 2
# The key holding the change(s)
changes:
  - title: Forwarded workload logs to Loki via Pebble log targets
    author: michaelthamm
    type: minor
    description: |
      When related to a charm that provides the `logging` interface, Traefik now
      configures a Pebble log target that forwards the workload's logs to the
      related Loki push endpoints. Previously the charm read the `logging`
      interface but did not forward any logs.
    urls:
      pr:
        - https://github.com/canonical/traefik-k8s-operator/pull/781
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Removed the duplicate local log file
    author: michaelthamm
    type: breaking
    description: |
      Traefik no longer writes its logs to `/var/log/traefik.log`. The file was
      never rotated, so it grew until the disk filled, and it wrote every log
      line twice. Logs are still available from the workload's stdout through
      `pebble logs traefik` and `kubectl logs`, and over the `logging`
      interface.
    urls:
      pr:
        - https://github.com/canonical/traefik-k8s-operator/pull/781
      related_doc:
      related_issue:
    visibility: public
    highlight: false
