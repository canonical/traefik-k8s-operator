# Version of the artifact schema
version_schema: 2
# The key holding the change(s)
changes:
  - title: Forwarded workload logs to Loki using `LogForwarder`
    author: michaelthamm
    type: minor
    description: |
      The charm now uses `LogForwarder` from the `loki_push_api` library
      instead of `LokiPushApiConsumer`. When related to a charm that provides
      the `logging` interface, it configures a Pebble log target that forwards
      the workload's logs to the related Loki push endpoints. Previously the
      charm read the `logging` interface but did not forward any logs.
    urls:
      pr:
        - https://github.com/canonical/traefik-k8s-operator/pull/781
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Removed the local log file written via `tee`
    author: michaelthamm
    type: breaking
    description: |
      Traefik no longer writes its logs to `/var/log/traefik.log`. The service
      command used to `tee` the workload's output to that file in addition to
      stdout, but `tee` was called without `-a`, so it opened the file in write
      mode and truncated it on every service restart rather than appending to
      it. Logs remain available from the workload's stdout through
      `pebble logs traefik` and `kubectl logs`, and over the `logging`
      interface.
    urls:
      pr:
        - https://github.com/canonical/traefik-k8s-operator/pull/781
      related_doc:
      related_issue:
    visibility: public
    highlight: false
