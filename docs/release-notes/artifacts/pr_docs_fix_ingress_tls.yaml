changes:
  - title: Fixed several documentation issues across ingress libraries and TLS guidance
    author: swetha1654
    type: bugfix
    description: |
      Fixed a broken code example in the "How to integrate your charm to Traefik" guide,
      clarified how `provide_ingress_requirements` interacts with the `IngressPerAppRequirer`
