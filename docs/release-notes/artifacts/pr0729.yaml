# Version of the artifact schema
version_schema: 2
# The key holding the change(s)
changes:
  - title: Handle TLS private key and CSR migration
    author: swetha1654
    type: bugfix
    description: |
      Reworked the TLS private key handling so that an existing private key,
      stored in a Juju secret by an earlier revision, is reused on upgrade
      instead of generating a new one. Also during migration from unit to app mode,
      copy the CSR from the unit databag to app databag. This prevents an 
      unnecessary new CSR re-issuance.
    urls:
      pr:
        - https://github.com/canonical/traefik-k8s-operator/pull/729
      related_doc:
      related_issue:
    visibility: public
    highlight: false
