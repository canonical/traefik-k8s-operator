project: traefik-k8s-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04:
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration/:
    working-dir: ./
    summary: integration tests
    backends:
    - integration-test
    systems:
    - ubuntu-24.04
    auto-discover: true
    pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --no-juju-teardown --juju-model testing --keep-models --model testing --base {{ env.get("BASE", "ubuntu@26.04") }}'
    environment:
      # Base 20.04 tests
      BASE/legacy_test_charm_ipa_2004: ubuntu@20.04
      MODULE/legacy_test_charm_ipa_2004: tests/integration/legacy/test_charm_ipa.py
      BASE/jubilant_test_upgrade_2004: ubuntu@20.04
      MODULE/jubilant_test_upgrade_2004: tests/integration/test_upgrade.py
      # Manual-TLS upgrade tests: the source Charmhub revisions come up on
      # ubuntu@20.04, so the upgrade target must match that base (a base
      # mismatch breaks the charm venv). Override BASE on the auto-discovered
      # variants so these run only on 20.04.
      BASE/test_upgrade_manual_tls_from_280: ubuntu@20.04
      BASE/test_upgrade_manual_tls_from_298: ubuntu@20.04
      BASE/test_upgrade_manual_tls_from_280_via_298: ubuntu@20.04
      BASE/test_upgrade_manual_tls_leader_change_from_298: ubuntu@20.04
      BASE/test_upgrade_manual_tls_single_unit_from_280: ubuntu@20.04
      BASE/test_upgrade_manual_tls_single_unit_from_298: ubuntu@20.04
      BASE/test_upgrade_manual_tls_single_unit_from_280_via_298: ubuntu@20.04
      BASE/test_upgrade_self_signed_from_280: ubuntu@20.04
      BASE/test_upgrade_self_signed_from_298: ubuntu@20.04
      BASE/test_upgrade_self_signed_from_280_via_298: ubuntu@20.04
      BASE/test_upgrade_self_signed_leader_change_from_298: ubuntu@20.04
      BASE/test_upgrade_self_signed_single_unit_from_280: ubuntu@20.04
      BASE/test_upgrade_self_signed_single_unit_from_298: ubuntu@20.04
      BASE/test_upgrade_self_signed_single_unit_from_280_via_298: ubuntu@20.04
      BASE/test_upgrade_no_tls_from_280: ubuntu@20.04
      BASE/test_upgrade_no_tls_from_298: ubuntu@20.04
      BASE/test_upgrade_no_tls_from_280_via_298: ubuntu@20.04
      BASE/test_upgrade_no_tls_leader_change_from_298: ubuntu@20.04
