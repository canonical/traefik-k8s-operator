project: traefik-k8s-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04:
    - ubuntu-24.04-arm64:
        runner: [ubuntu-24.04-arm]
    prepare: |
      if [ -n "${PRE_SCRIPT:-}" ]; then
        bash "${SPREAD_PATH}/${PRE_SCRIPT}"
      fi
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration/:
    working-dir: ./
    summary: integration tests
    backends:
    - integration-test
    systems:
    - ubuntu-24.04
    auto-discover: true
    # TEMPORARY: skip test_u* files (the 20.04-only upgrade tests) and add back
    # the two non-20.04 ones explicitly below.
    discover-pattern: "test_[!u]*.py"
    pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --no-juju-teardown --juju-model testing --base {{ env.get("BASE", "ubuntu@26.04") }}'
    environment:
      MODULE/test_upgrade: tests/integration/test_upgrade.py
      MODULE/test_upstream_ingress: tests/integration/test_upstream_ingress.py
      PRE_SCRIPT/test_workload_tracing: s3-installation.sh
  tests/integration/arm64:
    working-dir: ./
    summary: integration tests
    backends:
    - integration-test
    systems:
    - ubuntu-24.04-arm64
    auto-discover: false
    pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --no-juju-teardown --juju-model testing'
    environment:
      MODULE/jubilant_test_ingress_relations: tests/integration/test_ingress_relations.py
  tests/integration/juju4/:
    working-dir: ./
    summary: integration tests
    backends:
    - integration-test
    systems:
    - ubuntu-24.04
    auto-discover: false
    pytest-arguments-template: '-x --log-format="%(asctime)s %(levelname)s %(message)s" --no-juju-teardown --juju-model testing --base {{ env.get("BASE", "ubuntu@26.04") }}'
    environment:
      CONCIERGE: concierge-juju4.yaml
      MODULE/jubilant_test_dynamic_configs_juju4: tests/integration/test_dynamic_configs.py
      MODULE/jubilant_test_https_multi_unit_juju4: tests/integration/test_https_multi_unit.py
      MODULE/jubilant_test_logging_juju4: tests/integration/test_logging.py
      MODULE/jubilant_test_receive_ca_cert_status_juju4: tests/integration/test_receive_ca_cert_status.py
